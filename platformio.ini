; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c6-lcd-1.47]
platform = espressif32
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200

; Отключаем Wi-Fi и Bluetooth для экономии ресурсов и освобождения пинов
build_flags =
    -DCONFIG_LVGL_ENABLE_FULL
    -DCONFIG_LVGL_COLOR_DEPTH=16
    -DCONFIG_LVGL_TICK_RATE_MIN=10
    -DCONFIG_LVGL_USING_STATISTICS=N
    -DCONFIG_ESP_TASK_WDT_TIMEOUT_S=30
    -Wno-macro-redefined

; Отключаем Wi-Fi и Bluetooth на уровне конфигурации ESP-IDF
; Это экономит память и освобождает пины GPIO5/GPIO6
espidf_custom_sdkconfig_opts =
    CONFIG_ESP_WIFI_ENABLED=n
    CONFIG_BT_ENABLED=n
    CONFIG_FREERTOS_UNICORE=n
    CONFIG_ESP_SYSTEM_WIFI_ENABLED=n
    CONFIG_BTDM_CTRL_MODE_BTDM=n
    CONFIG_BTDM_CTRL_MODE_LE_ONLY=n
    CONFIG_ESP_BLUETOOTH_ENABLED=n

# LVGL настройки
